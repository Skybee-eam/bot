services:
  - type: web
    name: skybee-bot
    env: node
    plan: free
    buildCommand: npm install && npm --prefix CypherX/CypherX-main install
    startCommand: node index.js
    envVars:
      - key: ACCESS_CODE
        sync: false
      - key: PAIRING_ONLY_MODE
        value: "true"
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3000
